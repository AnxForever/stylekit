  <rect x="151" y="412" width="14" height="13" fill="#4AF626"/>
  <rect x="168" y="412" width="14" height="13" fill="#4AF626"/>
  <rect x="185" y="412" width="14" height="13" fill="#4AF626"/>
  <rect x="202" y="412" width="14" height="13" fill="#4AF626"/>
  <rect x="219" y="412" width="14" height="13" fill="#4AF626"/>
