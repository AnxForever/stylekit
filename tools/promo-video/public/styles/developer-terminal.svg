  <rect x="321" y="412" width="14" height="13" fill="#1F2937"/>
  <rect x="338" y="412" width="14" height="13" fill="#1F2937"/>
  <rect x="355" y="412" width="14" height="13" fill="#1F2937"/>
  <rect x="372" y="412" width="14" height="13" fill="#1F2937"/>
  <rect x="389" y="412" width="14" height="13" fill="#1F2937"/>
  <text x="408" y="424" font-family="monospace" font-size="13" fill="#4AF626">]</text>
  <text x="426" y="424" font-family="monospace" font-size="13" fill="#FFB86C">67%</text>
  <text x="470" y="424" font-family="monospace" font-size="12" fill="#6272A4"># tests still running</text>

  <!-- Final prompt with blinking cursor block -->
  <text x="64" y="458" font-family="monospace" font-size="14"><tspan fill="#8BE9FD">visitor@stylekit</tspan><tspan fill="#6272A4">:~$</tspan><tspan fill="#4AF626"> start_session</tspan></text>
  <rect x="330" y="444" width="10" height="17" fill="#4AF626"/>

  <!-- Faint CRT scanline overlay on the window -->
