  <text x="842" y="250" font-family="monospace" font-size="12" fill="#8BE9FD">$term-green</text>
  <text x="1064" y="250" font-family="monospace" font-size="12" fill="#FFB86C">#4AF626</text>
  <rect x="816" y="262" width="14" height="14" rx="2" fill="#8BE9FD"/>
  <text x="842" y="274" font-family="monospace" font-size="12" fill="#8BE9FD">$term-cyan</text>
  <text x="1064" y="274" font-family="monospace" font-size="12" fill="#FFB86C">#8BE9FD</text>
  <rect x="816" y="286" width="14" height="14" rx="2" fill="#FF79C6"/>
  <text x="842" y="298" font-family="monospace" font-size="12" fill="#8BE9FD">$term-magenta</text>
  <text x="1064" y="298" font-family="monospace" font-size="12" fill="#FFB86C">#FF79C6</text>
  <rect x="816" y="310" width="14" height="14" rx="2" fill="#FFB86C"/>
  <text x="842" y="322" font-family="monospace" font-size="12" fill="#8BE9FD">$term-amber</text>
  <text x="1064" y="322" font-family="monospace" font-size="12" fill="#FFB86C">#FFB86C</text>
  <rect x="816" y="334" width="14" height="14" rx="2" fill="#6272A4"/>
  <text x="842" y="346" font-family="monospace" font-size="12" fill="#8BE9FD">$term-comment</text>
  <text x="1064" y="346" font-family="monospace" font-size="12" fill="#FFB86C">#6272A4</text>

  <!-- ================= Right column: command buttons ================= -->
  <rect x="800" y="390" width="360" height="120" rx="4" fill="#0D141B" stroke="#1F2937" stroke-width="1.5"/>
  <text x="816" y="416" font-family="monospace" font-size="12" fill="#6272A4"># buttons are executables</text>
  <rect x="816" y="428" width="146" height="30" rx="3" fill="#4AF626"/>
  <text x="830" y="447" font-family="monospace" font-size="12" font-weight="bold" fill="#0A0E12">./deploy --prod</text>
