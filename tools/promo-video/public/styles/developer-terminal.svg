  <text x="164" y="543" font-family="monospace" font-size="12" fill="#8BE9FD">rounded-sm</text>
  <rect x="270" y="526" width="130" height="26" rx="3" fill="none" stroke="#1F2937" stroke-width="1"/>
  <text x="284" y="543" font-family="monospace" font-size="12" fill="#FFB86C">bg-[#0A0E12]</text>
  <rect x="410" y="526" width="176" height="26" rx="3" fill="none" stroke="#1F2937" stroke-width="1"/>
  <text x="424" y="543" font-family="monospace" font-size="12" fill="#6272A4">border-[#1F2937]</text>
  <rect x="1096" y="526" width="64" height="26" rx="3" fill="none" stroke="#4AF626" stroke-opacity="0.5" stroke-width="1"/>
  <text x="1108" y="543" font-family="monospace" font-size="12" fill="#4AF626">[0] OK</text>

