<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <pattern id="dt-scan" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#8BE9FD" opacity="0.04"/>
    </pattern>
    <filter id="dt-glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0A0E12"/>

  <!-- ================= Main terminal window ================= -->
  <rect x="40" y="40" width="740" height="470" rx="4" fill="#0D141B" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Title bar with three dots -->
  <rect x="41.5" y="41.5" width="737" height="32" rx="3" fill="#111821"/>
  <line x1="41" y1="74" x2="779" y2="74" stroke="#1F2937" stroke-width="1"/>
  <circle cx="60" cy="58" r="5" fill="#FF79C6"/>
  <circle cx="78" cy="58" r="5" fill="#FFB86C"/>
  <circle cx="96" cy="58" r="5" fill="#4AF626"/>
  <text x="116" y="62" font-family="monospace" font-size="12" fill="#6272A4">visitor@stylekit: ~/showcase -- 80x24</text>

  <!-- Boot sequence -->
  <text x="64" y="102" font-family="monospace" font-size="13" fill="#6272A4">Last login: Fri Jul 5 09:41:07 2026 on ttys001</text>
  <text x="64" y="126" font-family="monospace" font-size="13"><tspan fill="#8BE9FD">[ OK ]</tspan><tspan fill="#4AF626"> mounted /dev/portfolio</tspan></text>
  <text x="64" y="148" font-family="monospace" font-size="13"><tspan fill="#8BE9FD">[ OK ]</tspan><tspan fill="#4AF626"> loaded 12 projects, 34 posts, 1 developer</tspan></text>
  <text x="64" y="170" font-family="monospace" font-size="13"><tspan fill="#FFB86C">[WARN]</tspan><tspan fill="#4AF626"> coffee level at 12% -- refill recommended</tspan></text>

  <!-- Prompt + central title -->
  <text x="64" y="202" font-family="monospace" font-size="14"><tspan fill="#8BE9FD">visitor@stylekit</tspan><tspan fill="#6272A4">:~$</tspan><tspan fill="#4AF626"> echo $STYLE_NAME</tspan></text>
  <text x="64" y="244" font-family="monospace" font-size="38" font-weight="bold" fill="#4AF626" filter="url(#dt-glow)">DEVELOPER TERMINAL</text>
  <text x="64" y="272" font-family="monospace" font-size="13" fill="#6272A4"># 终端风 -- a website as a terminal session</text>

  <!-- ASCII divider -->
  <line x1="64" y1="292" x2="300" y2="292" stroke="#1F2937" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="312" y="296" font-family="monospace" font-size="11" fill="#6272A4">projects</text>
  <line x1="384" y1="292" x2="756" y2="292" stroke="#1F2937" stroke-width="1.5" stroke-dasharray="7 4"/>

  <!-- ls -la listing -->
  <text x="64" y="322" font-family="monospace" font-size="14"><tspan fill="#8BE9FD">visitor@stylekit</tspan><tspan fill="#6272A4">:~$</tspan><tspan fill="#4AF626"> ls -la ~/projects</tspan></text>
  <text x="64" y="346" font-family="monospace" font-size="13"><tspan fill="#6272A4">drwxr-xr-x  4096  Jul 03 21:14  </tspan><tspan fill="#8BE9FD">stylekit-registry/</tspan></text>
  <text x="64" y="368" font-family="monospace" font-size="13"><tspan fill="#6272A4">-rw-r--r--   18K  Jun 28 09:02  </tspan><tspan fill="#4AF626">design-tokens.json</tspan></text>
