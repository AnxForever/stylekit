  <rect x="40" y="570" width="1120" height="32" rx="3" fill="#0D141B" stroke="#1F2937" stroke-width="1.5"/>
  <rect x="52" y="577" width="76" height="18" rx="3" fill="#4AF626"/>
  <text x="59" y="590" font-family="monospace" font-size="11" font-weight="bold" fill="#0A0E12">[stylekit]</text>
