  <text x="222" y="590" font-family="monospace" font-size="11" fill="#6272A4">1:logs</text>
  <text x="272" y="590" font-family="monospace" font-size="11" fill="#6272A4">2:monitor</text>
  <text x="880" y="590" font-family="monospace" font-size="11" fill="#FFB86C">load: 0.42</text>
  <text x="962" y="590" font-family="monospace" font-size="11" fill="#8BE9FD">09:41:07</text>
