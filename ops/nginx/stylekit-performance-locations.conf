# StyleKit performance locations
#
# Include this file inside the `server { ... }` block for
# www.stylekit.top, before the catch-all `location /` proxy. It is intentionally
# a locations-only include: the existing server block keeps ownership of TLS,
# auth-sensitive routes, SSE, and the upstream proxy settings.
#
# The paths below are either content-addressed by Next (`/_next/static`) or
# cacheable public files. They never contain user/session data, so they are
# safe for an edge CDN and can be served without waking the Node process.

location ^~ /_next/static/ {
    alias /www/stylekit/.next/static/;
    access_log off;
    log_not_found off;

    # This location bypasses Next.js, so enable transfer compression here as
    # well. `gzip_proxied any` also compresses an origin fill requested by the
    # CDN; the edge can then retain and serve the encoded variant.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # `add_header` in a location stops inheriting server-level add_header
    # directives, so repeat the security headers used by the app here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Cache headers intentionally omit `always`: missing files must not create
    # long-lived negative cache entries at the edge.
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header CDN-Cache-Control "public, max-age=31536000";
    # Required when NEXT_PUBLIC_ASSET_PREFIX points at a separate hostname.
    add_header Access-Control-Allow-Origin "*";
    # Allows browser RUM to expose transfer sizes and timing for CDN assets.
    add_header Timing-Allow-Origin "*";
}

# Public files are kept under stable, non-authenticated prefixes. Keep the
# prefix list narrow so dynamic feeds and API-like routes are still handled by
# Next. `try_files` returns a normal 404 for a missing asset instead of sending
# a second request through the application.
location ~* ^/(?:styles|templates|images|brand|readme|video|launch|experiments|submission)/.+\.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|mp4|webm|m4v)$ {
    root /www/stylekit/public;
    try_files $uri =404;
    access_log off;
    log_not_found off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Cache headers intentionally omit `always`: missing files must not create
    # long-lived negative cache entries at the edge.
    add_header Cache-Control "public, max-age=86400, s-maxage=2592000, stale-while-revalidate=604800";
    add_header CDN-Cache-Control "public, max-age=2592000";
    add_header Access-Control-Allow-Origin "*";
    add_header Timing-Allow-Origin "*";
}
