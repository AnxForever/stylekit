# http-level rate-limit zone for the StyleKit MCP endpoint.
#
# nginx only accepts limit_req_zone in the http {} context, so this file is
# included by /etc/nginx/nginx.conf through conf.d/*.conf. Keep the rate in
# sync with the MCP process's own default (MCP_RATE_LIMIT=120).

limit_req_zone $binary_remote_addr zone=stylekit_mcp:10m rate=120r/m;
