# StyleKit remote MCP
#
# Server-level include for www.stylekit.top. Install this file OUTSIDE conf.d
# (for example /etc/nginx/snippets/stylekit-mcp-locations.conf) because
# conf.d/*.conf is included in the http {} context, where `location` is illegal.
# Include it inside the www.stylekit.top server block, before location /:
#
#   include /etc/nginx/snippets/stylekit-mcp-locations.conf;
#
# The limit_req_zone lives in stylekit-mcp-zone.conf, which conf.d/*.conf
# already includes in the http {} context. The MCP process listens on loopback
# only; TLS and the public host name stay owned by nginx.

# Update MCP_HTTP_PORT in stylekit-mcp.service if you change the upstream port.

# Prefix match covers /mcp and /mcp/<toolset>; the proxy_pass URI keeps the
# subpath when it forwards to the process.
location ^~ /mcp {
    limit_req zone=stylekit_mcp burst=20 nodelay;
    limit_req_status 429;

    client_max_body_size 1m;

    proxy_pass http://127.0.0.1:8787/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # HTTP mode answers with JSON, not an SSE stream. Disabling buffering keeps
    # a slow tool call from being held back by the proxy.
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
