server {
    listen 80;
    listen [::]:80;
    server_name stylekit.top www.stylekit.top;

    # ACME challenge direct serve (before redirect)
    location /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
        try_files $uri =404;
    }

    location / {
        return 301 https://www.stylekit.top$request_uri;
    }
}

# Redirect non-www to www (HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stylekit.top;

    ssl_certificate /etc/letsencrypt/live/stylekit.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stylekit.top/privkey.pem;

    return 301 https://www.stylekit.top$request_uri;
}

# Main server block (www only)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.stylekit.top;

    ssl_certificate /etc/letsencrypt/live/stylekit.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stylekit.top/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    server_tokens off;
    client_max_body_size 10M;

    add_header X-Content-Type-Options 'nosniff' always;
    add_header X-Frame-Options 'SAMEORIGIN' always;
    add_header Referrer-Policy 'strict-origin-when-cross-origin' always;
    add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;

    error_page 500 502 503 504 /__stylekit_50x.html;

    location = /__stylekit_50x.html {
        alias /var/www/errors/stylekit-50x.html;
        internal;
    }

    # SSE streaming for agent chat
    location /api/agent/chat/stream {
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding off;
    }

    location / {
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_buffer_size 512k;
        proxy_buffers 8 512k;
        proxy_busy_buffers_size 1024k;
        proxy_read_timeout 120s;
    }
}
