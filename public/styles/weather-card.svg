<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#b8e4f9"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ff8c5a"/>
    </linearGradient>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8"/>
    </filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- Cloud 1 -->
  <g filter="url(#blur2)" opacity="0.7">
    <ellipse cx="300" cy="180" rx="120" ry="50" fill="white"/>
    <ellipse cx="360" cy="160" rx="80" ry="45" fill="white"/>
    <ellipse cx="240" cy="170" rx="70" ry="40" fill="white"/>
  </g>

  <!-- Cloud 2 -->
  <g filter="url(#blur2)" opacity="0.5">
    <ellipse cx="850" cy="120" rx="100" ry="40" fill="white"/>
    <ellipse cx="900" cy="105" rx="70" ry="35" fill="white"/>
    <ellipse cx="800" cy="115" rx="60" ry="30" fill="white"/>
  </g>

  <!-- Sun with rays -->
  <circle cx="900" cy="200" r="60" fill="url(#sunset)" filter="url(#blur1)" opacity="0.6"/>
  <circle cx="900" cy="200" r="45" fill="#ff6b35"/>
  <g stroke="#ff6b35" stroke-width="3" opacity="0.5">
    <line x1="900" y1="130" x2="900" y2="110"/>
    <line x1="900" y1="270" x2="900" y2="290"/>
    <line x1="830" y1="200" x2="810" y2="200"/>
    <line x1="970" y1="200" x2="990" y2="200"/>
    <line x1="850" y1="150" x2="836" y2="136"/>
    <line x1="950" y1="250" x2="964" y2="264"/>
    <line x1="850" y1="250" x2="836" y2="264"/>
    <line x1="950" y1="150" x2="964" y2="136"/>
  </g>

  <!-- Glassmorphic card -->
  <rect x="200" y="260" width="500" height="280" rx="24" fill="white" fill-opacity="0.35" stroke="white" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="200" y="260" width="500" height="140" rx="24" fill="white" fill-opacity="0.15"/>

  <!-- Temperature display -->
  <text x="260" y="360" font-family="system-ui, sans-serif" font-size="72" font-weight="700" fill="#333">22</text>
  <text x="370" y="340" font-family="system-ui, sans-serif" font-size="28" font-weight="500" fill="#666">C</text>

  <!-- Condition text -->
  <text x="260" y="400" font-family="system-ui, sans-serif" font-size="20" fill="#666">Partly Cloudy</text>

  <!-- Small cloud icon on card -->
  <g transform="translate(560, 300)" opacity="0.6">
    <ellipse cx="30" cy="25" rx="30" ry="15" fill="#87CEEB"/>
    <ellipse cx="45" cy="18" rx="20" ry="12" fill="#87CEEB"/>
    <ellipse cx="18" cy="22" rx="18" ry="10" fill="#87CEEB"/>
  </g>

  <!-- Title text -->
  <text x="260" y="490" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#444">Weather Card</text>
  <text x="260" y="520" font-family="system-ui, sans-serif" font-size="14" fill="#888">Atmospheric animations with glassmorphic overlays</text>
</svg>
