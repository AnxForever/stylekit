<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <filter id="warm-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-brass" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="tube-glow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#d4a017" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3d2b1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0b020"/>
      <stop offset="50%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>
    <linearGradient id="wood-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a3525"/>
      <stop offset="50%" stop-color="#3d2b1f"/>
      <stop offset="100%" stop-color="#2a1f15"/>
    </linearGradient>
    <pattern id="wood-grain" x="0" y="0" width="200" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 4 Q50 2 100 4 T200 4" fill="none" stroke="#5c3d2e" stroke-width="0.8" opacity="0.3"/>
    </pattern>
    <pattern id="speaker-grille" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2.5" fill="#2a1f15"/>
      <circle cx="6" cy="6" r="3.5" fill="none" stroke="#d4a017" stroke-width="0.3" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#wood-grad)"/>
  <rect width="1200" height="630" fill="url(#wood-grain)"/>

  <!-- Warm ambient glow -->
  <rect width="1200" height="630" fill="url(#tube-glow)"/>

  <!-- Radio cabinet outer shell -->
  <rect x="150" y="80" width="900" height="470" rx="20" fill="#3d2b1f" stroke="#d4a017" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Inner wood panel -->
  <rect x="170" y="100" width="860" height="430" rx="12" fill="#2a1f15"/>
  <rect x="170" y="100" width="860" height="430" rx="12" fill="url(#wood-grain)" opacity="0.5"/>

  <!-- Cream dial panel -->
  <rect x="200" y="120" width="500" height="260" rx="10" fill="#f5e6d3"/>
  <rect x="200" y="120" width="500" height="260" rx="10" fill="none" stroke="#d4a017" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Frequency numbers on dial -->
  <text x="230" y="165" font-family="Georgia, serif" font-size="14" fill="#3d2b1f" opacity="0.7">530</text>
  <text x="300" y="165" font-family="Georgia, serif" font-size="14" fill="#3d2b1f" opacity="0.7">700</text>
  <text x="380" y="165" font-family="Georgia, serif" font-size="14" fill="#3d2b1f" opacity="0.7">900</text>
  <text x="455" y="165" font-family="Georgia, serif" font-size="14" fill="#3d2b1f" opacity="0.7">1100</text>
  <text x="535" y="165" font-family="Georgia, serif" font-size="14" fill="#3d2b1f" opacity="0.7">1400</text>
  <text x="620" y="165" font-family="Georgia, serif" font-size="14" fill="#3d2b1f" opacity="0.7">1600</text>

  <!-- Dial scale lines -->
  <line x1="230" y1="175" x2="230" y2="185" stroke="#3d2b1f" stroke-width="1" opacity="0.5"/>
  <line x1="310" y1="175" x2="310" y2="185" stroke="#3d2b1f" stroke-width="1" opacity="0.5"/>
  <line x1="390" y1="175" x2="390" y2="185" stroke="#3d2b1f" stroke-width="1" opacity="0.5"/>
  <line x1="470" y1="175" x2="470" y2="185" stroke="#3d2b1f" stroke-width="1" opacity="0.5"/>
  <line x1="550" y1="175" x2="550" y2="185" stroke="#3d2b1f" stroke-width="1" opacity="0.5"/>
  <line x1="630" y1="175" x2="630" y2="185" stroke="#3d2b1f" stroke-width="1" opacity="0.5"/>

  <!-- Dial indicator needle -->
  <line x1="430" y1="175" x2="430" y2="200" stroke="#d4a017" stroke-width="2.5" filter="url(#soft-brass)"/>
  <circle cx="430" cy="200" r="4" fill="#d4a017" filter="url(#soft-brass)"/>

  <!-- FM label -->
  <text x="350" y="230" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#3d2b1f" opacity="0.8">FM</text>
  <text x="390" y="230" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#d4a017" opacity="0.9">STEREO</text>

  <!-- Station name display -->
  <rect x="250" y="250" width="400" height="50" rx="6" fill="#3d2b1f"/>
  <text x="450" y="282" font-family="Georgia, serif" font-size="20" fill="#d4a017" text-anchor="middle" filter="url(#soft-brass)">GOLDEN CLASSICS 98.7</text>

  <!-- AM/FM band indicator -->
  <text x="280" y="340" font-family="Georgia, serif" font-size="12" fill="#3d2b1f" opacity="0.6">AM</text>
  <rect x="300" y="328" width="60" height="18" rx="4" fill="#d4a017" opacity="0.8"/>
  <text x="315" y="342" font-family="Georgia, serif" font-size="12" fill="#3d2b1f" font-weight="700">FM</text>
  <text x="380" y="340" font-family="Georgia, serif" font-size="12" fill="#3d2b1f" opacity="0.6">SW</text>

  <!-- Speaker grille area -->
  <rect x="730" y="120" width="280" height="260" rx="10" fill="#2a1f15"/>
  <rect x="740" y="130" width="260" height="240" rx="8" fill="url(#speaker-grille)"/>
  <rect x="740" y="130" width="260" height="240" rx="8" fill="none" stroke="#d4a017" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Speaker center cone -->
  <circle cx="870" cy="250" r="60" fill="none" stroke="#d4a017" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="870" cy="250" r="30" fill="none" stroke="#d4a017" stroke-width="0.8" stroke-opacity="0.2"/>
  <circle cx="870" cy="250" r="8" fill="#d4a017" opacity="0.4"/>

  <!-- Brass knobs row -->
  <circle cx="300" cy="460" r="28" fill="url(#brass-grad)" filter="url(#soft-brass)"/>
  <circle cx="300" cy="460" r="20" fill="none" stroke="#8b6914" stroke-width="1.5"/>
  <line x1="300" y1="435" x2="300" y2="445" stroke="#3d2b1f" stroke-width="2" stroke-linecap="round"/>
  <text x="300" y="505" font-family="Georgia, serif" font-size="11" fill="#f5e6d3" text-anchor="middle" opacity="0.7">VOLUME</text>

  <circle cx="450" cy="460" r="28" fill="url(#brass-grad)" filter="url(#soft-brass)"/>
  <circle cx="450" cy="460" r="20" fill="none" stroke="#8b6914" stroke-width="1.5"/>
  <line x1="450" y1="435" x2="458" y2="443" stroke="#3d2b1f" stroke-width="2" stroke-linecap="round"/>
  <text x="450" y="505" font-family="Georgia, serif" font-size="11" fill="#f5e6d3" text-anchor="middle" opacity="0.7">TONE</text>

  <circle cx="600" cy="460" r="28" fill="url(#brass-grad)" filter="url(#soft-brass)"/>
  <circle cx="600" cy="460" r="20" fill="none" stroke="#8b6914" stroke-width="1.5"/>
  <line x1="600" y1="435" x2="592" y2="443" stroke="#3d2b1f" stroke-width="2" stroke-linecap="round"/>
  <text x="600" y="505" font-family="Georgia, serif" font-size="11" fill="#f5e6d3" text-anchor="middle" opacity="0.7">TUNING</text>

  <!-- Power indicator LED -->
  <circle cx="780" cy="460" r="6" fill="#d4a017" opacity="0.9" filter="url(#soft-brass)"/>
  <text x="780" y="480" font-family="Georgia, serif" font-size="10" fill="#f5e6d3" text-anchor="middle" opacity="0.5">POWER</text>

  <!-- Title text -->
  <text x="600" y="580" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#f5e6d3" text-anchor="middle" filter="url(#warm-glow)">Retro Radio</text>
  <text x="600" y="610" font-family="Georgia, serif" font-size="16" fill="#d4a017" text-anchor="middle" opacity="0.8">Warm Analog Aesthetics</text>
</svg>