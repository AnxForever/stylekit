<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#faf5ef"/>
  <!-- Decorative border -->
  <rect x="30" y="20" width="740" height="360" fill="none" stroke="#2d4a2d" stroke-width="1.5" rx="4"/>
  <rect x="40" y="30" width="720" height="340" fill="none" stroke="#2d4a2d" stroke-width="0.5" rx="2"/>
  <!-- Left botanical: leaf cluster -->
  <path d="M80 200 Q100 150 120 200 Q100 250 80 200Z" fill="none" stroke="#2d4a2d" stroke-width="1.5"/>
  <line x1="100" y1="160" x2="100" y2="240" stroke="#2d4a2d" stroke-width="0.8"/>
  <path d="M60 170 Q80 130 100 160" fill="none" stroke="#2d4a2d" stroke-width="1"/>
  <path d="M60 230 Q80 270 100 240" fill="none" stroke="#2d4a2d" stroke-width="1"/>
  <path d="M70 150 Q90 110 110 140" fill="none" stroke="#2d4a2d" stroke-width="0.8"/>
  <path d="M70 250 Q90 290 110 260" fill="none" stroke="#2d4a2d" stroke-width="0.8"/>
  <!-- Left small leaves -->
  <path d="M120 120 Q135 100 150 120 Q135 140 120 120Z" fill="none" stroke="#2d4a2d" stroke-width="1"/>
  <path d="M120 280 Q135 300 150 280 Q135 260 120 280Z" fill="none" stroke="#2d4a2d" stroke-width="1"/>
  <!-- Right botanical: leaf cluster -->
  <path d="M720 200 Q700 150 680 200 Q700 250 720 200Z" fill="none" stroke="#2d4a2d" stroke-width="1.5"/>
  <line x1="700" y1="160" x2="700" y2="240" stroke="#2d4a2d" stroke-width="0.8"/>
  <path d="M740 170 Q720 130 700 160" fill="none" stroke="#2d4a2d" stroke-width="1"/>
  <path d="M740 230 Q720 270 700 240" fill="none" stroke="#2d4a2d" stroke-width="1"/>
  <path d="M730 150 Q710 110 690 140" fill="none" stroke="#2d4a2d" stroke-width="0.8"/>
  <path d="M730 250 Q710 290 690 260" fill="none" stroke="#2d4a2d" stroke-width="0.8"/>
  <!-- Right small leaves -->
  <path d="M680 120 Q665 100 650 120 Q665 140 680 120Z" fill="none" stroke="#2d4a2d" stroke-width="1"/>
  <path d="M680 280 Q665 300 650 280 Q665 260 680 280Z" fill="none" stroke="#2d4a2d" stroke-width="1"/>
  <!-- Top decorative vine -->
  <path d="M200 50 Q300 30 400 50 Q500 70 600 50" fill="none" stroke="#2d4a2d" stroke-width="0.8"/>
  <circle cx="300" cy="40" r="3" fill="#8b6914" opacity="0.6"/>
  <circle cx="500" cy="58" r="3" fill="#8b6914" opacity="0.6"/>
  <!-- Bottom decorative vine -->
  <path d="M200 350 Q300 370 400 350 Q500 330 600 350" fill="none" stroke="#2d4a2d" stroke-width="0.8"/>
  <circle cx="300" cy="360" r="3" fill="#8b6914" opacity="0.6"/>
  <circle cx="500" cy="342" r="3" fill="#8b6914" opacity="0.6"/>
  <!-- Gold accent ornament -->
  <path d="M380 140 L400 125 L420 140 L400 155Z" fill="none" stroke="#8b6914" stroke-width="1.2"/>
  <!-- Style name -->
  <text x="400" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="40" fill="#2d4a2d" letter-spacing="4">Victorian</text>
  <text x="400" y="255" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#8b6914" font-style="italic" letter-spacing="6">Botanical</text>
</svg>