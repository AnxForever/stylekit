<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <filter id="green-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="vignette" cx="50%" cy="50%" r="65%" fx="50%" fy="50%">
      <stop offset="40%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
    </radialGradient>

    <radialGradient id="screen-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#002200" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000800" stop-opacity="0"/>
    </radialGradient>

    <pattern id="scanlines" x="0" y="0" width="1200" height="4" patternUnits="userSpaceOnUse">
      <rect fill="#000000" opacity="0.35" width="1200" height="2" y="0"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0d1117"/>

  <!-- Screen glow -->
  <rect width="1200" height="630" fill="url(#screen-glow)"/>

  <!-- Scanlines -->
  <rect width="1200" height="630" fill="url(#scanlines)"/>

  <!-- Top status bar -->
  <text x="40" y="40" font-family="monospace" font-size="14" fill="#00ff41" opacity="0.5">SYS://voice-recorder v2.4.1</text>
  <text x="1160" y="40" font-family="monospace" font-size="14" fill="#00ff41" opacity="0.5" text-anchor="end">SIGNAL: OK</text>
  <line x1="30" y1="52" x2="1170" y2="52" stroke="#00ff41" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Waveform bars - left cluster -->
  <rect x="80" y="320" width="16" height="60" fill="#00ff41" opacity="0.9" filter="url(#soft-glow)"/>
  <rect x="104" y="280" width="16" height="100" fill="#00ff41" opacity="0.85"/>
  <rect x="128" y="240" width="16" height="140" fill="#00ff41" opacity="0.8" filter="url(#soft-glow)"/>
  <rect x="152" y="300" width="16" height="80" fill="#00ff41" opacity="0.75"/>
  <rect x="176" y="260" width="16" height="120" fill="#00ff41" opacity="0.85" filter="url(#soft-glow)"/>
  <rect x="200" y="310" width="16" height="70" fill="#00ff41" opacity="0.7"/>
  <rect x="224" y="290" width="16" height="90" fill="#00ff41" opacity="0.8"/>
  <rect x="248" y="250" width="16" height="130" fill="#00ff41" opacity="0.9" filter="url(#soft-glow)"/>
  <rect x="272" y="330" width="16" height="50" fill="#00ff41" opacity="0.65"/>
  <rect x="296" y="270" width="16" height="110" fill="#00ff41" opacity="0.85"/>

  <!-- Waveform bars - right cluster -->
  <rect x="888" y="290" width="16" height="90" fill="#00ff41" opacity="0.8"/>
  <rect x="912" y="250" width="16" height="130" fill="#00ff41" opacity="0.9" filter="url(#soft-glow)"/>
  <rect x="936" y="310" width="16" height="70" fill="#00ff41" opacity="0.7"/>
  <rect x="960" y="260" width="16" height="120" fill="#00ff41" opacity="0.85" filter="url(#soft-glow)"/>
  <rect x="984" y="300" width="16" height="80" fill="#00ff41" opacity="0.75"/>
  <rect x="1008" y="240" width="16" height="140" fill="#00ff41" opacity="0.8" filter="url(#soft-glow)"/>
  <rect x="1032" y="280" width="16" height="100" fill="#00ff41" opacity="0.85"/>
  <rect x="1056" y="320" width="16" height="60" fill="#00ff41" opacity="0.9" filter="url(#soft-glow)"/>
  <rect x="1080" y="270" width="16" height="110" fill="#00ff41" opacity="0.75"/>
  <rect x="1104" y="295" width="16" height="85" fill="#00ff41" opacity="0.8"/>

  <!-- Main title -->
  <text x="600" y="300" font-family="monospace" font-size="80" font-weight="900" fill="#00ff41" text-anchor="middle" filter="url(#green-glow)">VOICE</text>
  <text x="600" y="380" font-family="monospace" font-size="48" font-weight="700" fill="#00ff41" fill-opacity="0.8" text-anchor="middle" filter="url(#soft-glow)">RECORDER</text>

  <!-- Decorative line -->
  <line x1="380" y1="400" x2="820" y2="400" stroke="#00ff41" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Recording indicator -->
  <circle cx="560" cy="440" r="6" fill="#ff0040" opacity="0.9" filter="url(#soft-glow)"/>
  <text x="580" y="445" font-family="monospace" font-size="18" fill="#00ff41" opacity="0.7">REC 00:03:42</text>

  <!-- Bottom status -->
  <line x1="30" y1="570" x2="1170" y2="570" stroke="#00ff41" stroke-width="1" stroke-opacity="0.15"/>
  <text x="40" y="595" font-family="monospace" font-size="13" fill="#00ff41" opacity="0.4">SAMPLE: 44.1kHz</text>
  <text x="600" y="595" font-family="monospace" font-size="13" fill="#00ff41" opacity="0.4" text-anchor="middle">BUFFER: 1024 // LATENCY: 12ms</text>
  <text x="1160" y="595" font-family="monospace" font-size="13" fill="#00ff41" opacity="0.4" text-anchor="end">CH: STEREO</text>

  <!-- Vignette overlay -->
  <rect width="1200" height="630" fill="url(#vignette)"/>
</svg>
