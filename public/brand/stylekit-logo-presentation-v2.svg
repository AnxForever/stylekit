  <text x="760" y="807" fill="#4B4842" font-family="Arial, sans-serif" font-size="21">Monochrome at the core. Color belongs to the style being curated.</text>
  <text x="760" y="840" fill="#4B4842" font-family="Arial, sans-serif" font-size="21">Editorial at large scale. Clear and recognizable at 32 px.</text>

