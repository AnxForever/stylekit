  <text x="98" y="846" fill="#4B4842" font-family="Arial, sans-serif" font-size="22">A high-contrast S meets a geometric K.</text>
  <text x="98" y="880" fill="#4B4842" font-family="Arial, sans-serif" font-size="22">The cut aperture turns the monogram into a frame for many styles.</text>

