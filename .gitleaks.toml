# Gitleaks allowlist for false-positive patterns.
#
# StyleKit uses kebab-case translation keys like `vocab.tilt3dDef` and
# i18n key strings like `anim.examplePrompts` heavily. The default
# `generic-api-key` rule's high-entropy heuristic flags these as
# potential secrets, but they are stable identifiers with no security
# implication.

[allowlist]
description = "Translation key strings (kebab-case identifiers, no security value)"
targetRules = ["generic-api-key"]
regexes = [
  # definitionKey / nameKey / labelKey: "vocab.<token>" or "anim.<token>"
  '''(?:definitionKey|nameKey|labelKey|groupLabelKey)\s*:\s*['"]?(vocab|anim|nav|animations?|recipes?|playground|common|templates?|blog|home|profile|footer|sandbox)\.[a-zA-Z][a-zA-Z0-9]*['"]?''',
  # Translation values that look like API keys but are kebab-case phrases
  '''['"]vocab\.[a-z][a-zA-Z]+['"]''',
]

# Explicit per-file allowlist for vocabulary and translations files,
# which are dense with kebab-case i18n keys.
paths = [
  '''(?i)(vocabulary|translations|navigation|nav-config)\.(ts|tsx|js|json)$''',
]
