name: Feature Request
description: Suggest a new feature or improvement for StyleKit.
title: "[Feature] "
labels:
  - enhancement
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe what you'd like to see in StyleKit.

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this solve? Why is it needed?
      placeholder: "I often need to export styles as CSS custom properties, but only Tailwind preset is available."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you think this should work?
      placeholder: "Add a 'CSS Variables' export option alongside the existing Tailwind preset export."
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of StyleKit does this relate to?
      options:
        - New style
        - New animation
        - New template
        - Export / Integration
        - AI tools (prompt builder, linter, etc.)
        - API
        - UI / UX improvement
        - Performance
        - Accessibility
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Would use regularly
        - Blocking my workflow

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you tried any workarounds?

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'm willing to submit a PR for this feature
