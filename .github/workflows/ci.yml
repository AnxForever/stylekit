name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:catalog
      - run: pnpm run check:recipe-lint
      - run: pnpm run check:support-assets
      - run: pnpm run check:product-truth
      - run: pnpm run check:experience-packs
      - run: pnpm run check:seo-truth
      - run: pnpm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run smoke:local
      - name: Verify sitemap runtime invariants
        run: |
          pnpm start -p 3100 > /tmp/stylekit-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3100/sitemap.xml > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/stylekit-next.log
              exit 1
            fi
            sleep 1
          done

          SEO_CHECK_ORIGIN=http://127.0.0.1:3100 pnpm run check:seo-runtime

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        env:
          # ubuntu-latest now points at 26.04, which Playwright 1.58 does not
          # recognise: `playwright install` aborts with "Playwright does not
          # support chromium on ubuntu26.04-x64" before downloading anything.
          # The Linux browser build is identical across Ubuntu releases, so
          # borrow the 24.04 dependency list instead of pinning the whole job
          # to an older runner. Remove the override once @playwright/test is
          # upgraded to a release that knows 26.04.
          PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
      - run: pnpm run build
      - run: pnpm exec playwright test --config tests/playwright.config.ts
        env:
          BASE_URL: http://localhost:3000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
