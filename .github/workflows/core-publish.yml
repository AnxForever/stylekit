name: Publish stylekit-core

on:
  push:
    tags:
      - "core-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Verify release tag
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const { version } = JSON.parse(readFileSync("packages/core/package.json", "utf8"));
          if (process.env.GITHUB_REF_NAME !== `core-v${version}`) {
            throw new Error(`Release tag does not match package version ${version}`);
          }
          NODE

      - run: pnpm install --frozen-lockfile --config.strict-dep-builds=false

      - name: Build and typecheck core
        run: |
          cd packages/core
          ./node_modules/.bin/tsup
          ./node_modules/.bin/tsc --noEmit

      - name: Pack release artifact
        run: pnpm --dir packages/core pack --out "$RUNNER_TEMP/stylekit-core.tgz"

      - name: Verify package (dry-run)
        run: pnpm publish "$RUNNER_TEMP/stylekit-core.tgz" --dry-run --no-git-checks --ignore-scripts --tag beta

      - name: Publish to npm
        run: pnpm publish "$RUNNER_TEMP/stylekit-core.tgz" --provenance --access public --no-git-checks --ignore-scripts --tag beta
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
