name: Style Extractor CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: style-extractor-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style-extractor:
    name: Style Extractor Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dorny/paths-filter@v3
        id: extractor_changes
        with:
          filters: |
            style_extractor:
              - "style-extractor-dev"
              - "style-extractor-dev/**"
              - "tests/unit/style-extractor-registry.test.ts"
              - "tools/scripts/check-style-extractor.cjs"
              - "package.json"
              - "pnpm-lock.yaml"
              - "tests/vitest.config.ts"
              - ".gitmodules"
              - ".github/workflows/style-extractor-ci.yml"
      - uses: actions/setup-node@v4
        if: steps.extractor_changes.outputs.style_extractor == 'true'
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        if: steps.extractor_changes.outputs.style_extractor == 'true'
      - run: npm run test:style-extractor:ci
        if: steps.extractor_changes.outputs.style_extractor == 'true'
      - run: echo "No style-extractor changes detected. Skipping heavy checks."
        if: steps.extractor_changes.outputs.style_extractor != 'true'
