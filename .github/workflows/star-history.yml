name: Star History

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-star-history:
    name: Update README star history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate star history SVG
        run: node tools/scripts/generate-star-history.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push update branch
        run: |
          if git diff --quiet -- public/readme/star-history.svg; then
            echo "Star history is already up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B automation/star-history
          git add public/readme/star-history.svg
          git commit -m "docs: update star history"
          git push --force origin automation/star-history

          echo "Star history update branch pushed." >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update pull request
        run: |
          if gh pr list --head automation/star-history --base main --state open --json number | grep -q '"number"'; then
            echo "Pull request already exists." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh pr create \
            --head automation/star-history \
            --base main \
            --title "docs: update star history" \
            --body "Automated star history chart update from daily cron job." \
            --label "automation"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
