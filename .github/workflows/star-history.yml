name: Star History

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-star-history:
    name: Update README star history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate star history SVG
        run: node tools/scripts/generate-star-history.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push update branch
        run: |
          if git diff --quiet -- public/readme/star-history.svg; then
            echo "Star history is already up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B automation/star-history
          git add public/readme/star-history.svg
          git commit -m "docs: update star history"
          git push --force-with-lease origin automation/star-history

          {
            echo "Star history update branch pushed."
            echo
            echo "Open a PR from:"
            echo "https://github.com/AnxForever/stylekit/compare/main...automation/star-history"
          } >> "$GITHUB_STEP_SUMMARY"
