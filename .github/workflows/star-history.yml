name: Star History

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-star-history:
    name: Update README star history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate star history SVG (light)
        run: |
          npx star-history-cli AnxForever/stylekit \
            --style xkcd \
            --format svg \
            --type Date \
            --width 800 \
            --theme light \
            --output public/readme/star-history.svg \
            --token "${{ secrets.GITHUB_TOKEN }}"

      - name: Generate star history SVG (dark)
        run: |
          npx star-history-cli AnxForever/stylekit \
            --style xkcd \
            --format svg \
            --type Date \
            --width 800 \
            --theme dark \
            --output public/readme/star-history-dark.svg \
            --token "${{ secrets.GITHUB_TOKEN }}"

      - name: Commit and push to main
        run: |
          if git diff --quiet -- public/readme/star-history.svg public/readme/star-history-dark.svg; then
            echo "Star history is already up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/readme/star-history.svg public/readme/star-history-dark.svg
          git commit -m "docs: update star history"
          git push origin main

          echo "Star history updated on main." >> "$GITHUB_STEP_SUMMARY"
