name: Star History

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-star-history:
    name: Update README star history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate star history SVG
        run: node tools/scripts/generate-star-history.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "docs: update star history"
          title: "docs: update star history"
          body: "Automated update for the README star history SVG."
          branch: "automation/star-history"
          delete-branch: true
          add-paths: "public/readme/star-history.svg"
