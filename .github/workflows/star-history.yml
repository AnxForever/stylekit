name: Star History

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-star-history:
    name: Update README star history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate star history SVG
        run: node tools/scripts/generate-star-history.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push to main
        run: |
          if git diff --quiet -- public/readme/star-history.svg; then
            echo "Star history is already up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/readme/star-history.svg
          git commit -m "docs: update star history"
          git push origin main

          echo "Star history updated on main." >> "$GITHUB_STEP_SUMMARY"
