name: Publish stylekit-mcp

on:
  push:
    tags:
      - "mcp-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    # Job-wide pnpm config so EVERY pnpm call (including the implicit deps
    # check pnpm runs before `pnpm run <script>`) tolerates this repo's setup:
    #   strict_dep_builds=false     -> pnpm-workspace.yaml disables protobufjs's
    #     build script; pnpm 11 otherwise exits 1 (ERR_PNPM_IGNORED_BUILDS).
    #   verify_deps_before_run=false-> don't re-install before each run script
    #     (that re-install re-hit the ignored-builds error and failed the job).
    env:
      npm_config_strict_dep_builds: "false"
      npm_config_verify_deps_before_run: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # This workflow publishes only the isolated packages/core + packages/mcp,
      # whose deps are @modelcontextprotocol/sdk, zod, tsup, tsx, typescript —
      # none of the app deps. --frozen-lockfile is avoided so an in-flight app
      # dependency upgrade (root package.json ahead of pnpm-lock.yaml) cannot
      # block an MCP release that does not touch those deps.
      # --no-frozen-lockfile: the app's in-flight dep upgrade left root
      # package.json ahead of the lockfile; unrelated to this release. (The
      # ignored-build tolerance comes from the job-level env above.)
      - run: pnpm install --no-frozen-lockfile

      - name: Build core (workspace dependency)
        run: pnpm --dir packages/core run build

      - name: Build mcp package
        run: pnpm --dir packages/mcp run build

      - name: Smoke test
        run: pnpm --dir packages/mcp test

      - name: Verify package (dry-run)
        run: pnpm --dir packages/mcp publish --dry-run --no-git-checks

      - name: Publish to npm
        run: pnpm --dir packages/mcp publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Step-level env replaces (not merges) the job env, so restate the
          # two pnpm config vars the pre-publish deps check needs.
          npm_config_strict_dep_builds: "false"
          npm_config_verify_deps_before_run: "false"

  publish-registry:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher

      - name: Authenticate (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        working-directory: packages/mcp
        run: |
          "$GITHUB_WORKSPACE/mcp-publisher" publish
