name: Publish stylekit-mcp

on:
  push:
    tags:
      - "mcp-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Two repo-specific install flags, both verified in a fresh worktree
      # (a warm node_modules hides both — must test on a clean checkout):
      #   --no-frozen-lockfile: the app's in-flight dep upgrade left root
      #     package.json ahead of pnpm-lock.yaml; unrelated to this release.
      #   --config.strict-dep-builds=false: pnpm-workspace.yaml disables
      #     protobufjs's build script; pnpm 11 otherwise exits 1
      #     (ERR_PNPM_IGNORED_BUILDS). Must be the CLI flag — the env var
      #     npm_config_strict_dep_builds is NOT honored for this key. Running
      #     it here resolves the build once, so the implicit deps check before
      #     each later `pnpm run` finds nothing pending and passes.
      - run: pnpm install --no-frozen-lockfile --config.strict-dep-builds=false

      - name: Build core (workspace dependency)
        run: pnpm --dir packages/core run build

      - name: Build mcp package
        run: pnpm --dir packages/mcp run build

      - name: Smoke test
        run: pnpm --dir packages/mcp test

      - name: Verify package (dry-run)
        run: pnpm --dir packages/mcp publish --dry-run --no-git-checks

      - name: Publish to npm
        run: pnpm --dir packages/mcp publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-registry:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher

      - name: Authenticate (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        working-directory: packages/mcp
        run: |
          "$GITHUB_WORKSPACE/mcp-publisher" publish
